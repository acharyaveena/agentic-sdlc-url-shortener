openapi: 3.0.3
info:
  title: URL Shortener API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/links:
    post:
      summary: Create a short link
      operationId: createLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: Link created
          headers:
            Location:
              description: The short URL
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Creation rate limit exceeded for this client
          headers:
            Retry-After:
              description: Seconds until the client may retry
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Could not allocate a unique short code after the maximum number of attempts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/links/{code}/stats:
    get:
      summary: Get click statistics for a short link
      operationId: getLinkStats
      parameters:
        - $ref: '#/components/parameters/Code'
      responses:
        '200':
          description: Link statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkStats'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/links/{code}/analytics:
    get:
      summary: Per-link click analytics for a UTC date range (read-only)
      operationId: getLinkAnalytics
      description: >
        Click history recorded from deployment onward, bucketed by UTC day. Available for
        expired links. Can differ from the all-time counter returned by .../stats.
      parameters:
        - $ref: '#/components/parameters/Code'
        - name: from
          in: query
          required: false
          description: Inclusive UTC start date. Defaults to `to` minus (app.analytics.default-range-days - 1).
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Inclusive UTC end date. Defaults to today (UTC).
          schema: { type: string, format: date }
        - name: excludeBots
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Analytics for the requested range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkAnalyticsResponse'
        '400':
          description: from later than to, range over app.analytics.max-range-days, or a malformed parameter
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /{code}:
    get:
      summary: Redirect to the long URL and count the click
      operationId: redirect
      parameters:
        - $ref: '#/components/parameters/Code'
      responses:
        '302':
          description: Redirect to the stored long URL
          headers:
            Location:
              description: The stored long URL
              schema: { type: string, format: uri }
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Link has expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  parameters:
    Code:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Za-z]{1,16}$'
  schemas:
    CreateLinkRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
          description: Absolute http or https URL that does not point back to this service
          example: https://example.com/page
        ttlSeconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 31536000
          description: Optional time-to-live override in seconds; defaults to app.link.default-ttl
    LinkResponse:
      type: object
      required: [code, shortUrl, longUrl, createdAt, expiresAt]
      properties:
        code:      { type: string, pattern: '^[0-9A-Za-z]{7}$', example: aZ3k9Qp }
        shortUrl:  { type: string, format: uri, example: http://localhost:8080/aZ3k9Qp }
        longUrl:   { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    LinkStats:
      type: object
      required: [code, longUrl, clickCount, createdAt]
      properties:
        code:       { type: string }
        longUrl:    { type: string, format: uri }
        clickCount: { type: integer, format: int64, minimum: 0 }
        createdAt:  { type: string, format: date-time }
    LinkAnalyticsResponse:
      type: object
      required: [code, from, to, excludeBots, totalClicks, daily, topReferrers, userAgents]
      properties:
        code: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        excludeBots: { type: boolean }
        totalClicks:
          type: integer
          format: int64
          description: Clicks in range after the bot filter. History starts at deployment.
        daily:
          type: array
          description: One entry per day from "from" to "to", zero-filled.
          items: { $ref: '#/components/schemas/DailyClicks' }
        topReferrers:
          type: array
          description: Referrer hosts only (never full URLs), ordered by clicks descending then host ascending.
          items: { $ref: '#/components/schemas/ReferrerCount' }
        userAgents:
          type: object
          required: [BROWSER, BOT, OTHER]
          properties:
            BROWSER: { type: integer, format: int64 }
            BOT: { type: integer, format: int64 }
            OTHER: { type: integer, format: int64 }
    DailyClicks:
      type: object
      required: [date, clicks]
      properties:
        date: { type: string, format: date }
        clicks: { type: integer, format: int64 }
    ReferrerCount:
      type: object
      required: [host, clicks]
      properties:
        host: { type: string, example: a.com }
        clicks: { type: integer, format: int64 }
    ProblemDetail:
      type: object
      description: RFC 7807 problem details
      properties:
        type:     { type: string, format: uri }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string }
  responses:
    BadRequest:
      description: Invalid or missing URL (bad scheme, too long, malformed, user-info, or self-referencing)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Unknown short code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
