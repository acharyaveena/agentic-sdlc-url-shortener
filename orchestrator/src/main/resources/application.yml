spring:
  main:
    banner-mode: off
  datasource:
    # File-based so a paused run (e.g. waiting for approval) survives between CLI invocations.
    url: jdbc:h2:file:./runs/orchestrator
    username: sa
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

orchestrator:
  workflow: workflow.yml
  agent:
    # mock needs no login; switch with --orchestrator.agent.mode=copilot
    mode: mock
    default-model: claude-sonnet-5.5
    timeout-seconds: 600
    models:
      requirements: claude-opus-5.5
      impact-analysis: claude-opus-5.5
      design: claude-opus-5.5
  approval:
    # Mock mode only; release always needs a human.
    auto-approve: false
  recovery:
    # Tries on the stage's own model, then one try on the fallback model. Build and policy scan run once.
    max-attempts: 2
    fallback-models:
      "[claude-opus-5.5]": claude-sonnet-5.5
      "[claude-sonnet-5.5]": claude-sonnet-5
  replan:
    # A stage may be produced at most this many times in one run (first version plus re-plans).
    max-revisions: 3
  audit:
    # One JSON-lines file per run.
    dir: runs/audit
  workspace:
    # root: defaults to the enclosing git repository; build-command defaults to the Maven wrapper on url-shortener
    build-timeout-seconds: 600
  policy:
    allowed-group-ids:
      - org.springframework.boot
      - org.springframework
      - com.h2database
      - org.hibernate.validator
      - jakarta.validation
      - org.junit.jupiter
      - org.mockito
      - org.assertj
      - org.apache.maven.plugins
