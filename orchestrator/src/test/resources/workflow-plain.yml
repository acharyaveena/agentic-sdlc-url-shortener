name: sdlc-plain
stages:
  - id: requirements
  - id: impact-analysis
    dependsOn: [requirements]
    skipFor: [greenfield]
  - id: design
    dependsOn: [impact-analysis]
  - id: code
    dependsOn: [design]
  - id: tests
    dependsOn: [design]
  - id: build-test
    dependsOn: [code, tests]
  - id: docs
    dependsOn: [build-test]
  - id: policy-scan
    dependsOn: [build-test]
  - id: release-readiness
    dependsOn: [docs, policy-scan]
